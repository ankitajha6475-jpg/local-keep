services:
  app:
    image: node:22-alpine
    container_name: local-keep
    working_dir: /app
    command: >
      sh -c "npm install && npx concurrently \"node --watch server.js\" \"npx vite --host 0.0.0.0\""
    environment:
      - DEBUG=local-keep:*
      - NODE_ENV=development
    ports:
      - "5173:5173"
      - "5174:5174"
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
